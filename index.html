<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<title>Südkurve 3D</title>

<style>

body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; }

#ui {

position: absolute; top: 15px; left: 15px; color: #fff;

background: rgba(180, 0, 20, 0.85); padding: 14px; border-radius: 10px;

border: 2px solid #fff; pointer-events: none; font-size: 13px;

}

#chant {

position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);

background: rgba(0,0,0,0.8); color: #fff; padding: 10px 22px;

border-radius: 20px; font-size: 18px; font-weight: bold; border: 2px solid #dc052d;

}

</style>

</head>

<body>

<div id="ui">

<b>🔴⚪ SÜDKURVE 3D</b><br><br>

[W A S D]: Laufen | [SPACE]: Springen<br>

[F]: Fahne/Winken | [E]: Gesang<br>

[Maus ziehen]: Kamera drehen

</div>

<div id="chant">🎵 "STERN DES SÜDENS..." 🎵</div>

<script src="https://cloudflare.com"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(innerWidth, innerHeight);

document.body.appendChild(renderer.domElement);


scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);

dirLight.position.set(20, 40, 20);

scene.add(dirLight);


const fans = [], tCount = 8, tDepth = 2.2, tHeight = 0.8, width = 34;


const pitch = new THREE.Mesh(new THREE.BoxGeometry(60, 0.5, 40), new THREE.MeshLambertMaterial({ color: 0x2e8b57 }));

pitch.position.set(0, -0.25, -22);

scene.add(pitch);


for (let i = 0; i < tCount; i++) {

const step = new THREE.Mesh(new THREE.BoxGeometry(width, tHeight, tDepth), new THREE.MeshLambertMaterial({ color: 0x555555 }));

step.position.set(0, i * tHeight + tHeight / 2, i * tDepth);

scene.add(step);

}


function makeFan(isPlayer, hasFlag) {

const g = new THREE.Group();

const skin = new THREE.MeshLambertMaterial({ color: 0xf1c27d });

const shirt = new THREE.MeshLambertMaterial({ color: isPlayer ? 0xffd700 : (Math.random() > 0.3 ? 0xdc052d : 0xffffff) });

const pants = new THREE.MeshLambertMaterial({ color: 0x111111 });


const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.7, 0.35), pants); lLeg.position.set(-0.2, 0.35, 0);

const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.7, 0.35), pants); rLeg.position.set(0.2, 0.35, 0);

const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.85, 0.4), shirt); body.position.set(0, 1.12, 0);

const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skin); head.position.set(0, 1.85, 0);

g.add(lLeg, rLeg, body, head);


const lArmP = new THREE.Group(); lArmP.position.set(-0.58, 1.45, 0);

const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.75, 0.3), skin); lArm.position.y = -0.3;

lArmP.add(lArm);


const rArmP = new THREE.Group(); rArmP.position.set(0.58, 1.45, 0);

const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.75, 0.3), skin); rArm.position.y = -0.3;

rArmP.add(rArm);

g.add(lArmP, rArmP);


if (hasFlag) {

const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.4), new THREE.MeshBasicMaterial({ color: 0xdddddd }));

pole.position.set(0, 0.4, 0.2); pole.rotation.x = 0.4;

const flag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.9, 1.3), new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xdc052d : 0xffffff }));

flag.position.set(0, 1.1, 0.85); pole.add(flag);

rArmP.add(pole); rArmP.rotation.x = -2.2;

}


const c = document.createElement('canvas'); c.width = 256; c.height = 64;

const ctx = c.getContext('2d');

const tex = new THREE.CanvasTexture(c);

const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));

sp.position.set(0, 2.5, 0); sp.scale.set(2.2, 0.55, 1);

g.add(sp);


function say(txt) {

ctx.clearRect(0, 0, 256, 64);

if (txt) {

ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(10, 10, 236, 44);

ctx.fillStyle = '#dc052d'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';

ctx.fillText(txt, 128, 40);

}

tex.needsUpdate = true;

}

return { mesh: g, lArm: lArmP, rArm: rArmP, hasFlag, vx: 0, vy: 0, vz: 0, grounded: true, waving: false, act: hasFlag ? 'flag' : 'jump', t: Math.random() * 50, say };

}


const player = makeFan(true, true);

player.mesh.position.set(0, 4 * tHeight, 4 * tDepth);

player.say("MIA SAN MIA!");

scene.add(player.mesh);


const shouts = ["OLE OLE!", "BAYERN!", "HÜPFEN!", "SUPER BAYERN!", "TOR!", "HEY!"];

for (let i = 0; i < 45; i++) {

const tr = Math.floor(Math.random() * tCount);

const f = makeFan(false, Math.random() < 0.25);

f.mesh.position.set((Math.random() - 0.5) * 30, (tr + 1) * tHeight, tr * tDepth + (Math.random() - 0.5) * 0.8);

f.mesh.rotation.y = Math.PI;

scene.add(f.mesh);

fans.push(f);

}


const keys = {};

onkeydown = e => {

keys[e.code] = true;

if (e.code === 'Space' && player.grounded) { player.vy = 0.22; player.grounded = false; }

if (e.code === 'KeyF') player.waving = !player.waving;

if (e.code === 'KeyE') {

const lines = ["🎵 STERN DES SÜDENS! 🎵", "🎵 SUPER BAYERN, HEY, HEY! 🎵", "🎵 STEHT AUF, WENN IHR BAYERN SEID! 🎵"];

document.getElementById('chant').innerText = lines[Math.floor(Math.random() * lines.length)];

player.say("BAYERN!!");

fans.forEach(f => { if (Math.random() > 0.4) { f.say(shouts[Math.floor(Math.random() * shouts.length)]); if (f.grounded) f.vy = 0.16; } });

}

};

onkeyup = e => keys[e.code] = false;


let camX = 0, camY = 0.35, drag = false;

onmousedown = () => drag = true;

onmouseup = () => drag = false;

onmousemove = e => { if (drag) { camX -= e.movementX * 0.008; camY = Math.max(0.1, Math.min(1.2, camY + e.movementY * 0.008)); } };


function groundY(z) {

const tr = Math.floor((z + tDepth / 2) / tDepth);

if (tr < 0) return 0;

if (tr >= tCount) return tCount * tHeight;

return (tr + 1) * tHeight;

}


let time = 0;

function loop() {

requestAnimationFrame(loop);

time += 0.05;


let mx = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);

let mz = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);

if (mx || mz) {

const ang = Math.atan2(mx, mz) + camX;

player.vx += Math.sin(ang) * 0.03;

player.vz += Math.cos(ang) * 0.03;

player.mesh.rotation.y = ang;

}


player.vx *= 0.82; player.vz *= 0.82;

player.mesh.position.x = Math.max(-16, Math.min(16, player.mesh.position.x + player.vx));

player.mesh.position.z = Math.max(-5, Math.min(tCount * tDepth - 1, player.mesh.position.z + player.vz));


player.vy -= 0.012;

player.mesh.position.y += player.vy;

const pg = groundY(player.mesh.position.z);

if (player.mesh.position.y <= pg) { player.mesh.position.y = pg; player.vy = 0; player.grounded = true; }


player.rArm.rotation.z = Math.sin(time * (player.waving ? 3 : 1)) * (player.waving ? 0.6 : 0.2);

player.lArm.rotation.x = player.waving ? -2.5 : 0;


fans.forEach(f => {

f.t += 0.05;

if (Math.random() < 0.005) {

f.act = f.hasFlag ? 'flag' : ['jump', 'wave', 'idle'][Math.floor(Math.random() * 3)];

f.say(Math.random() < 0.3 ? shouts[Math.floor(Math.random() * shouts.length)] : "");

}

if (f.act === 'jump' && f.grounded && Math.sin(f.t * 2) > 0.9) { f.vy = 0.14; f.grounded = false; }

if (f.act === 'wave') { f.lArm.rotation.x = -2.6; f.rArm.rotation.x = -2.6; f.lArm.rotation.z = Math.sin(f.t * 4) * 0.4; }

else if (f.act === 'flag') { f.rArm.rotation.z = Math.sin(f.t * 3) * 0.7; }

else { f.lArm.rotation.x = Math.sin(f.t * 2) * 0.3; f.rArm.rotation.x = -Math.sin(f.t * 2) * 0.3; }


f.vy -= 0.012; f.mesh.position.y += f.vy;

const fg = groundY(f.mesh.position.z);

if (f.mesh.position.y <= fg) { f.mesh.position.y = fg; f.vy = 0; f.grounded = true; }


const dx = f.mesh.position.x - player.mesh.position.x;

const dz = f.mesh.position.z - player.mesh.position.z;

const dist = Math.hypot(dx, dz);

if (dist < 0.95 && dist > 0.01) {

f.vx += (dx / dist) * 0.18; f.vz += (dz / dist) * 0.18;

player.vx -= (dx / dist) * 0.08; player.vz -= (dz / dist) * 0.08;

if (Math.random() < 0.1) f.say("HEY! 😄");

}


f.vx *= 0.85; f.vz *= 0.85;

f.mesh.position.x = Math.max(-16, Math.min(16, f.mesh.position.x + f.vx));

f.mesh.position.z = Math.max(-2, Math.min(tCount * tDepth - 1, f.mesh.position.z + f.vz));

});


camera.position.set(

player.mesh.position.x + Math.sin(camX) * 7.5 * Math.cos(camY),

player.mesh.position.y + 2 + Math.sin(camY) * 7.5,

player.mesh.position.z + Math.cos(camX) * 7.5 * Math.cos(camY)

);

camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1.5, player.mesh.position.z);

renderer.render(scene, camera);

}

loop();

</script>

</body>

</html>
